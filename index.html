<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lịch chi hội</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#eef1f7;--surface:#fff;--soft:#f5f7fb;--ink:#121b33;--muted:#5a6580;--line:#dbe1ee;
  --brand:#3347c9;--hero:#1d2a7a;--hero-ink:#fff;--ok:#15803d;--warn:#b45309;--danger:#be123c;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1224;--surface:#151d36;--soft:#1b2542;--ink:#e8ecf8;--muted:#93a0c2;--line:#27325a;
  --brand:#8d9bff;--hero:#26358f;--ok:#4ade80;--warn:#fbbf24;--danger:#fb7185;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;padding:0 16px 60px}
.wrap{max-width:920px;margin:0 auto}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
header{padding:26px 0 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.stamp{color:var(--muted);font-size:.82rem;display:flex;align-items:center;gap:8px}
.link{border:0;background:none;color:var(--brand);font-weight:600;padding:0}
.demo{background:var(--soft);border:1px dashed var(--brand);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.err{background:#fde4ea;color:#7f1230;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.88rem}
.filters{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 12px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:500;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{margin-top:30px}
h2{font-size:1.1rem;margin:0 0 12px;font-weight:700}
h2 small{color:var(--muted);font-weight:500;margin-left:8px}

/* Hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:24px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.date{text-align:center;min-width:96px;border-right:1px solid rgba(255,255,255,.25);padding-right:22px}
.date b{display:block;font-size:4rem;line-height:.95;font-weight:800;font-variant-numeric:tabular-nums}
.date span{font-size:.9rem;opacity:.85}
.hero h3{margin:0;font-size:1.5rem;line-height:1.25;font-weight:700}
.hero p{margin:8px 0 0;opacity:.88;max-width:60ch}
.when{display:inline-block;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 12px;font-weight:600;font-size:.85rem;margin-bottom:10px}
.facts{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:.88rem;opacity:.92}
.nohero{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}

/* Cards, rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;padding:12px 14px}
.mini{text-align:center;background:var(--soft);border-radius:10px;padding:6px 0;line-height:1.1}
.mini b{display:block;font-size:1.3rem}.mini span{font-size:.72rem;color:var(--muted)}
.t{font-weight:600}.m{color:var(--muted);font-size:.84rem}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.tag i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}

/* Notices */
.note{padding:14px 16px;border-left:4px solid var(--c,var(--brand))}
.note.pin{background:var(--soft)}
.note h4{margin:0 0 4px;font-size:1rem}
.note p{margin:6px 0 0;white-space:pre-line}

/* Tasks */
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.col{padding:14px 16px}
.col h4{margin:0;font-size:.98rem;display:flex;justify-content:space-between;gap:8px}
.bar{height:5px;background:var(--line);border-radius:9px;margin:8px 0 10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--brand))}
.task{padding:8px 0;border-top:1px solid var(--line)}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.st{font-size:.76rem;font-weight:600;padding:1px 8px;border-radius:999px;margin-left:6px}
.st.x{background:#dff3e4;color:#15803d}.st.d{background:#fdf0dc;color:#b45309}.st.c{background:var(--soft);color:var(--muted)}

/* Timeline */
.yr{display:flex;align-items:center;gap:10px}
.yr button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 10px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mo{padding:10px 12px;min-height:96px}
.mo.now{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand) inset}
.mo h5{margin:0 0 6px;font-size:.84rem;display:flex;justify-content:space-between;color:var(--muted)}
.ev{display:flex;gap:6px;font-size:.8rem;line-height:1.3;margin-top:4px}
.ev i{flex:0 0 8px;height:8px;border-radius:50%;margin-top:5px;background:var(--c,var(--muted))}
.ev.past{opacity:.5}
.empty{color:var(--muted);font-size:.9rem;padding:14px 4px}
@media (max-width:760px){.months{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){
  .hero{grid-template-columns:1fr}.date{border:0;padding:0;text-align:left;display:flex;gap:10px;align-items:baseline}
  .date b{font-size:3rem}.row{grid-template-columns:56px 1fr}.row .tag{grid-column:2}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">Lịch chi hội</h1>
    <div class="stamp"><span id="stamp"></span><button class="link" id="refresh">Tải lại</button></div>
  </header>
  <div id="banner"></div>
  <nav class="filters" id="filters" aria-label="Lọc theo ban"></nav>

  <section><h2>Sự kiện sắp tới</h2><div id="hero"></div><div id="next" class="rows" style="margin-top:10px"></div></section>
  <section><h2>Thông báo</h2><div id="notes" class="rows"></div></section>
  <section><h2>Việc cần làm của các ban</h2><div id="tasks" class="tasks"></div></section>
  <section><div class="yr"><h2 style="margin:0">Cả năm</h2><button id="py" aria-label="Năm trước">‹</button><b id="yl"></b><button id="ny" aria-label="Năm sau">›</button><small id="yc" class="m"></small></div>
    <div id="months" class="months" style="margin-top:12px"></div></section>
</div>

<script>
/* ===== CẤU HÌNH: chỉ cần sửa phần này ===== */
const CONFIG = {
  name: 'Lịch chi hội',        // tên hiển thị ở đầu trang
  sheetId: '',                 // dán ID Google Sheet vào đây; để trống = xem dữ liệu mẫu
  refreshMinutes: 5
};
const BANS = [
  { key:'tc', name:'Tài chính đối ngoại', k:'tai chinh', sheet:'Viec_TaiChinh',    c:'#b7791f' },
  { key:'tt', name:'Truyền thông',        k:'truyen thong', sheet:'Viec_TruyenThong', c:'#a3297a' },
  { key:'nd', name:'Nội dung',            k:'noi dung',  sheet:'Viec_NoiDung',     c:'#0f766e' }
];
/* ========================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim();
const banOf = t => { const n = norm(t); return BANS.find(b => n.includes(b.k)) || null; };
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const TODAY = () => day0(new Date());
let DATA = { events:[], notes:[], tasks:[] }, filter = 'all', year = new Date().getFullYear(), demo = false;

/* --- Đọc CSV từ Google Sheets --- */
function parseCSV(t) {
  const out = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i+1] === '\n') i++; row.push(cur); out.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length) { row.push(cur); out.push(row); }
  return out;
}
async function fetchSheet(name) {
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(name);
  const rows = parseCSV(await res.text());
  const head = rows.shift().map(h => norm(h).replace(/\s+/g, '_'));
  return rows.filter(r => r.some(c => c.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
function parseDate(s) {
  let m = /^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s || '');
  if (m) return new Date(+m[1], m[2] - 1, +m[3]);
  m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s || '');
  return m ? new Date(+m[3], m[2] - 1, +m[1]) : null;
}
const toEvent = r => { const start = parseDate(r.bat_dau); if (!start || !r.ten) return null;
  return { title:r.ten, start, end: parseDate(r.ket_thuc) || start, time:r.gio, place:r.dia_diem, ban:banOf(r.ban), desc:r.mo_ta }; };
const toNote = r => r.tieu_de ? { date:parseDate(r.ngay_dang), author:r.nguoi_dang, ban:banOf(r.ban), title:r.tieu_de, body:r.noi_dung, pin:!!r.ghim } : null;
const toTask = (r, ban) => r.viec ? { ban, event:r.su_kien, task:r.viec, person:r.nguoi_lam, due:parseDate(r.han), status:norm(r.trang_thai) } : null;

async function loadAll() {
  if (!CONFIG.sheetId) { demo = true; return demoData(); }
  const errs = [];
  const safe = async n => { try { return await fetchSheet(n); } catch { errs.push(n); return []; } };
  const [ev, nt, ...tk] = await Promise.all([safe('SuKien'), safe('ThongBao'), ...BANS.map(b => safe(b.sheet))]);
  DATA = { events: ev.map(toEvent).filter(Boolean), notes: nt.map(toNote).filter(Boolean),
           tasks: tk.flatMap((rows, i) => rows.map(r => toTask(r, BANS[i])).filter(Boolean)) };
  $('#banner').innerHTML = errs.length ? `<div class="err">Không đọc được các trang: <b>${esc(errs.join(', '))}</b>. Hãy kiểm tra tên trang tính và quyền chia sẻ của Google Sheet (bất kỳ ai có liên kết đều được xem).</div>` : '';
}
function demoData() {
  const t = TODAY(), d = n => new Date(t.getFullYear(), t.getMonth(), t.getDate() + n);
  DATA = {
    events: [
      { title:'Họp tổng kết học kỳ', start:d(-12), end:d(-12), time:'19:00', place:'Online', ban:null, desc:'' },
      { title:'Hội thảo giao lưu doanh nghiệp', start:d(9), end:d(9), time:'14:00', place:'Phòng hội thảo A', ban:BANS[0], desc:'Mời 3 doanh nghiệp tham gia chia sẻ. Thành viên mặc đồng phục chi hội.' },
      { title:'Chụp ảnh kỷ yếu chi hội', start:d(20), end:d(20), time:'09:00', place:'Sân trường', ban:BANS[1], desc:'' },
      { title:'Tuần lễ văn hoá', start:d(45), end:d(49), time:'', place:'Khuôn viên trường', ban:null, desc:'Chương trình chính của chi hội trong năm.' },
      { title:'Workshop viết nội dung', start:d(75), end:d(75), time:'18:30', place:'Online', ban:BANS[2], desc:'' }],
    notes: [
      { date:d(-1), author:'Chi hội trưởng', ban:null, title:'Lịch họp ban chi hội tuần này', body:'Họp lúc 20:00 tối thứ Năm.\nMọi người nhớ chuẩn bị báo cáo tiến độ.', pin:true },
      { date:d(-3), author:'Trưởng ban Truyền thông', ban:BANS[1], title:'Gửi ảnh cho kỷ yếu', body:'Các bạn gửi ảnh vào thư mục chung trước cuối tuần.', pin:false }],
    tasks: [
      { ban:BANS[0], event:'Hội thảo giao lưu doanh nghiệp', task:'Liên hệ 3 doanh nghiệp khách mời', person:'An', due:d(4), status:'dang lam' },
      { ban:BANS[0], event:'Hội thảo giao lưu doanh nghiệp', task:'Lập dự trù kinh phí', person:'Bình', due:d(-2), status:'xong' },
      { ban:BANS[1], event:'Hội thảo giao lưu doanh nghiệp', task:'Thiết kế poster', person:'Chi', due:d(5), status:'chua lam' },
      { ban:BANS[2], event:'Hội thảo giao lưu doanh nghiệp', task:'Soạn kịch bản MC', person:'Dũng', due:d(6), status:'dang lam' }]
  };
  $('#banner').innerHTML = '<div class="demo">Đang xem <b>dữ liệu mẫu</b>. Dán ID Google Sheet vào phần CẤU HÌNH ở đầu đoạn script để hiện dữ liệu thật của chi hội.</div>';
}

/* --- Hiển thị --- */
const fmtD = d => d ? d.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' }) : '';
const tag = b => `<span class="tag" style="--c:${b ? b.c : 'var(--muted)'}"><i></i>${b ? esc(b.name) : 'Toàn chi hội'}</span>`;
const show = b => filter === 'all' || !b || b.key === filter;   // mục "Toàn chi hội" luôn hiện
const when = e => {
  const t = TODAY(), s = Math.round((e.start - t) / 864e5);
  if (e.start <= t && e.end >= t) return 'Đang diễn ra';
  return s === 0 ? 'Hôm nay' : s === 1 ? 'Ngày mai' : `Còn ${s} ngày`;
};
const range = e => e.end > e.start ? `${fmtD(e.start)} – ${fmtD(e.end)}` : fmtD(e.start);
const miniDate = e => `<div class="mini"><b>${e.start.getDate()}</b><span>Th${e.start.getMonth() + 1}</span></div>`;

function render() {
  $('#title').textContent = CONFIG.name;
  document.title = CONFIG.name;
  $('#filters').innerHTML = [{ key:'all', name:'Tất cả' }, ...BANS].map(b =>
    `<button class="chip" data-f="${b.key}" aria-pressed="${filter === b.key}">${esc(b.name)}</button>`).join('');

  const upcoming = DATA.events.filter(e => e.end >= TODAY() && show(e.ban)).sort((a, b) => a.start - b.start);
  const [first, ...rest] = upcoming;
  $('#hero').innerHTML = first ? `
    <div class="hero">
      <div class="date"><b>${first.start.getDate()}</b><span>Tháng ${first.start.getMonth() + 1}</span></div>
      <div><span class="when">${when(first)}</span>
        <h3>${esc(first.title)}</h3>
        <div class="facts">${first.time ? `<span>${esc(first.time)}</span>` : ''}${first.place ? `<span>${esc(first.place)}</span>` : ''}<span>${esc(first.ban ? first.ban.name : 'Toàn chi hội')}</span>${first.end > first.start ? `<span>${range(first)}</span>` : ''}</div>
        ${first.desc ? `<p>${esc(first.desc)}</p>` : ''}</div>
    </div>` : `<div class="nohero">Chưa có sự kiện sắp tới nào.</div>`;
  $('#next').innerHTML = rest.slice(0, 4).map(e => `
    <div class="card row">${miniDate(e)}<div><div class="t">${esc(e.title)}</div>
      <div class="m">${when(e)}${e.time ? ' · ' + esc(e.time) : ''}${e.place ? ' · ' + esc(e.place) : ''}</div></div>${tag(e.ban)}</div>`).join('');

  const notes = DATA.notes.filter(n => show(n.ban)).sort((a, b) => b.pin - a.pin || (b.date || 0) - (a.date || 0)).slice(0, 8);
  $('#notes').innerHTML = notes.length ? notes.map(n => `
    <article class="card note ${n.pin ? 'pin' : ''}" style="--c:${n.ban ? n.ban.c : 'var(--brand)'}">
      <h4>${n.pin ? 'Ghim · ' : ''}${esc(n.title)}</h4>
      <div class="m">${esc(n.author)}${n.author && n.date ? ' · ' : ''}${fmtD(n.date)} · ${n.ban ? esc(n.ban.name) : 'Toàn chi hội'}</div>
      ${n.body ? `<p>${esc(n.body)}</p>` : ''}</article>`).join('') : '<div class="empty">Chưa có thông báo.</div>';

  const bans = BANS.filter(b => filter === 'all' || b.key === filter);
  $('#tasks').innerHTML = bans.map(b => {
    const ts = DATA.tasks.filter(t => t.ban.key === b.key).sort((x, y) => (x.status === 'xong') - (y.status === 'xong') || (x.due || 9e15) - (y.due || 9e15));
    const done = ts.filter(t => t.status === 'xong').length, pct = ts.length ? Math.round(done / ts.length * 100) : 0;
    return `<div class="card col" style="--c:${b.c}"><h4><span>${esc(b.name)}</span><span class="m">${done}/${ts.length}</span></h4>
      <div class="bar"><i style="width:${pct}%"></i></div>
      ${ts.map(t => `<div class="task ${t.status === 'xong' ? 'done' : ''}"><div class="t">${esc(t.task)}
        <span class="st ${t.status === 'xong' ? 'x' : t.status.includes('dang') ? 'd' : 'c'}">${t.status === 'xong' ? 'Xong' : t.status.includes('dang') ? 'Đang làm' : 'Chưa làm'}</span></div>
        <div class="m">${esc(t.person)}${t.person && t.due ? ' · ' : ''}${t.due ? 'hạn ' + fmtD(t.due) : ''}${t.event ? ' · ' + esc(t.event) : ''}</div></div>`).join('') || '<div class="empty">Chưa có việc nào.</div>'}</div>`;
  }).join('');

  const evs = DATA.events.filter(e => e.start.getFullYear() === year && show(e.ban)).sort((a, b) => a.start - b.start);
  $('#yl').textContent = year; $('#yc').textContent = `${evs.length} sự kiện`;
  const nowM = new Date().getFullYear() === year ? new Date().getMonth() : -1;
  $('#months').innerHTML = Array.from({ length: 12 }, (_, m) => {
    const list = evs.filter(e => e.start.getMonth() === m);
    return `<div class="card mo ${m === nowM ? 'now' : ''}"><h5><span>Tháng ${m + 1}</span><span>${list.length || ''}</span></h5>
      ${list.map(e => `<div class="ev ${e.end < TODAY() ? 'past' : ''}" style="--c:${e.ban ? e.ban.c : 'var(--muted)'}"><i></i><span><b>${e.start.getDate()}</b> ${esc(e.title)}</span></div>`).join('')}</div>`;
  }).join('');
  $('#stamp').textContent = 'Cập nhật ' + new Date().toLocaleTimeString('vi-VN', { hour:'2-digit', minute:'2-digit' });
}

async function refresh() {
  $('#stamp').textContent = 'Đang tải…';
  try { await loadAll(); } catch { $('#banner').innerHTML = '<div class="err">Không tải được dữ liệu. Kiểm tra kết nối mạng và thử lại.</div>'; }
  render();
}
$('#filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (b) { filter = b.dataset.f; render(); } });
$('#py').onclick = () => { year--; render(); };
$('#ny').onclick = () => { year++; render(); };
$('#refresh').onclick = refresh;
refresh();
setInterval(refresh, CONFIG.refreshMinutes * 60000);
</script>
</body>
</html>
